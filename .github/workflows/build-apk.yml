name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        run: |
          SM="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SM" ]; then SM="$(command -s sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
      - name: Install deps
        run: npm install
      - name: Sync
        run: npx cap sync android
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/startestall.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=startestall \
            -Pandroid.injected.signing.key.password=android \
            -Pandroid.injected.signing.store.type=PKCS12
      - name: Copy
        run: |
          VER=$(node -p "require('./package.json').version")
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$SRC" "startestall-${VER}-debug.apk"
          cp "$SRC" "startestall-latest-debug.apk"
          sha256sum startestall-*.apk > SHA256SUMS.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: startestall-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            startestall-*.apk
            SHA256SUMS.txt
          retention-days: 90
